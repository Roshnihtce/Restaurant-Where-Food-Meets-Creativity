<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Roshni Singh">
    <meta name="description"
        content="This project is to design a Landing page for a Restaurant. You're given a Figma Design for the same.">

    <title>INTERNAL - Restaurant-Where Food Meets Creativity</title>
    <!-- Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=David+Libre:wght@400;500;700&family=Inder&display=swap"
        rel="stylesheet">

    <!-- CSS Files -->
    <link rel="stylesheet" href="./assets/css/style.css">
    <link rel="stylesheet" href="./assets/css/index.css">

</head>
<body>
    <header>
        <!-- Circle Image (Background Decoration) -->
        <img src="./assets/images/circles.svg" alt="Circle" class="circle-image">

        <!-- Header Section inside Container -->
        <div class="container">
            <header class="d-flex justify-content-between align-items-center">
                <div class="logo">
                    <img src="./assets/images/restaurant_logo.svg" alt="Restaurant Logo">
                </div>
                <nav>
                    <ul class="d-flex">
                        <li><a href="javascript: void(0)">Menu</a></li>
                        <li><a href="javascript: void(0)">Events</a></li>
                        <li><a href="javascript: void(0)">Gallery</a></li>
                        <li><a href="javascript: void(0)">About</a></li>
                        <li><a href="javascript: void(0)">Contact</a></li>
                    </ul>
                </nav>
                <a href="javascript: void(0)" class="book-table">Book a table</a>
            </header>
        </div>
    </header>
    <main>
        <!-- =============== Banner Section ================== -->
        <section class="hero-section d-flex justify-content-between align-items-center">
            <div class="container">
                <div class="left-panel">
                    <div class="logo-1">
                        <img src="./assets/images/foods_delicious_logo.svg" alt="Food Delicious Logo">
                    </div>
                    <h1>We provide the <span>best food for you</span></h1>
                    <p class="text-body">
                        Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut
                        labore et dolore magna aliqua.
                    </p>
                    <div class="buttons">
                        <a href="javascript:void(0)" class="btn">Menu</a>
                        <a href="javascript:void(0)" class="btn2">Book a table</a>
                    </div>

                    <!-- Social Icons -->
                    <div class="social-icons">
                        <a href="javascript:void(0)"><img src="./assets/images/facebook_logo.svg"
                            alt="Facebook"></a>
                        <a href="javascript:void(0)"><img src="./assets/images/instagram_logo.svg"
                            alt="Instagram"></a>
                        <a href="javascript:void(0)"><img src="./assets/images/twitter_logo.svg" 
                            alt="Twitter"></a>
                    </div>
                </div>
                <!-- Right Panel (Images) -->
                <div class="image-container">
                    <img src="./assets/images/banner_image.svg" class="food-image" alt="Delicious Food">
                    <!-- Decorative Leaves -->
                    <img src="./assets/images/leaves_1.svg" class="restaurant-image leaves-top-left"
                        alt="Decorative Leaves">
                    <img src="./assets/images/leaves_2.svg" class="restaurant-image leaves-top-right"
                        alt="Decorative Leaves">
                    <img src="./assets/images/leaves_3.svg" class="restaurant-image leaves-bottom-right"
                        alt="Decorative Leaves">
                </div>
            </div>
        </section>
    <!-- Our Special Dishes -->
    </main>
</body>
</html>
